name: Build Windows 11 & Fedora RPM Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. WINDOWS 11 BUILD
  # ==========================================
  build-windows:
    name: Build Windows 11 Installer
    runs-on: windows-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node Modules
        run: pnpm install

      - name: Download Sidecars & Mihomo Cores
        run: pnpm run prebuild x86_64-pc-windows-msvc

      - name: Setup Valid Updater Keys & Config
        shell: bash
        run: |
          pnpm tauri signer generate --ci -w ./ci_key
          node -e '
            const fs = require("fs");
            const confFile = "src-tauri/tauri.conf.json";
            if (fs.existsSync(confFile)) {
              const config = JSON.parse(fs.readFileSync(confFile, "utf8"));
              if (!config.plugins) config.plugins = {};
              if (!config.plugins.updater) config.plugins.updater = {};
              config.plugins.updater.pubkey = fs.readFileSync("./ci_key.pub", "utf8").trim();

              // Prevent embedding offline WebView2 (~150MB bloat)
              if (!config.bundle) config.bundle = {};
              if (!config.bundle.windows) config.bundle.windows = {};
              config.bundle.windows.webviewInstallMode = { type: "downloadBootstrapper" };

              fs.writeFileSync(confFile, JSON.stringify(config, null, 2));
              console.log("[+] Configured updater key and lightweight WebView2 mode");
            }
            const key = fs.readFileSync("./ci_key", "utf8").replace(/\r/g, "").trim();
            if (process.env.GITHUB_ENV) {
              fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY<<EOF\n${key}\nEOF\n`);
              console.log("[+] Successfully set TAURI_SIGNING_PRIVATE_KEY in GITHUB_ENV");
            }
          '

      # Only build NSIS installer (.exe)
      - name: Build Tauri Application
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload Windows 11 NSIS Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-Rev-Win11-x64-Setup
          path: "**/bundle/nsis/*.exe"

  # ==========================================
  # 2. FEDORA 44 RPM BUILD
  # ==========================================
  build-fedora44:
    name: Build Fedora 44 RPM
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Fedora 44 RPM in Native Container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:44 bash -c '
              set -e

              echo "[1/6] Installing Fedora build dependencies..."
              dnf install -y \
                gcc gcc-c++ make wget file git patchelf rpm-build \
                openssl-devel gtk3-devel webkit2gtk4.1-devel \
                libayatana-appindicator-gtk3-devel librsvg2-devel \
                libxslt-devel nodejs npm

              echo "[2/6] Installing Rust toolchain..."
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source "$HOME/.cargo/env"

              echo "[3/6] Installing pnpm..."
              npm install -g pnpm

              echo "[4/6] Installing project dependencies..."
              pnpm install

              echo "[5/6] Prebuilding sidecars..."
              pnpm run prebuild x86_64-unknown-linux-gnu

              pnpm tauri signer generate --ci -w ./ci_key
              export TAURI_SIGNING_PRIVATE_KEY="$(cat ./ci_key)"

              node -e '\''
                const fs = require("fs");
                const confFile = "src-tauri/tauri.conf.json";
                if (fs.existsSync(confFile)) {
                  const config = JSON.parse(fs.readFileSync(confFile, "utf8"));
                  if (!config.plugins) config.plugins = {};
                  if (!config.plugins.updater) config.plugins.updater = {};
                  config.plugins.updater.pubkey = fs.readFileSync("./ci_key.pub", "utf8").trim();
                  fs.writeFileSync(confFile, JSON.stringify(config, null, 2));
                  console.log("[+] Injected valid updater pubkey into tauri.conf.json");
                }
              '\''

              echo "[6/6] Building Fedora RPM package..."
              pnpm tauri build --target x86_64-unknown-linux-gnu --bundles rpm

              chmod -R a+rw /workspace/src-tauri/target || true
            '

      - name: Upload Fedora 44 RPM Installer
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-Rev-Fedora44-RPM-x64
          path: "**/bundle/rpm/*.rpm"
