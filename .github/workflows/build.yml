name: Build Windows 11 & Linux Installers

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    tags:
      - 'v*' # Triggers automatically when you push a version tag like v2.5.0

permissions:
  contents: write

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 11 / 10 64-bit
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc

          # Linux (Ubuntu, Debian, Fedora, Arch via AppImage/DEB)
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --- Linux Build Dependencies ---
      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      # --- Install Node modules & download core sidecars ---
      - name: Install Node Modules
        run: pnpm install

      - name: Download Sidecars & Mihomo Cores
        run: pnpm run prebuild

      # --- Compile and Package with Tauri ---
      - name: Build Tauri Application
        run: pnpm run build

      # --- Upload Artifacts for Windows ---
      - name: Upload Windows 11 Installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-Rev-Win11-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # --- Upload Artifacts for Linux ---
      - name: Upload Linux Packages (.deb and .AppImage)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-Rev-Linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # Optional: Automatically create a GitHub Release when pushing a git tag
  create-release:
    needs: build-app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Clash-Verge-Rev-Win11-x64
          path: release-assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Clash-Verge-Rev-Linux-x64
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
